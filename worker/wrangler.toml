name = "dans-ma-zone-strava"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Créé par : wrangler d1 create dans-ma-zone
# → colle ici le database_id renvoyé par la commande
[[d1_databases]]
binding = "DB"
database_name = "dans-ma-zone"
database_id = "fb279c5a-ceeb-44aa-bf92-f34bb2aece29"

# Valeurs publiques (le secret du client, lui, ne va JAMAIS ici : voir README,
# il se règle avec `wrangler secret put`)
[vars]
CORS_ORIGIN = "https://n58s29.github.io"
FRONTEND_URL = "https://n58s29.github.io/jppjr-dansmazone/"
STRAVA_CLIENT_ID = "279022"
# IDs athlète Strava autorisés à se connecter (les tiens + tes potes),
# séparés par des virgules. Vide = pas de restriction ici (repose alors
# uniquement sur la liste d'accès de l'appli côté Strava, cf. README).
ALLOWED_ATHLETE_IDS = "2048350333,102906342,183006924,103923248,26034038,18305356,13319621,4084240"
